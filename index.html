<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krabick - Ссылки</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- ОБЩИЕ НАСТРОЙКИ И АНИМИРОВАННЫЙ ФОН --- */
        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* --- МЯГКАЯ "ПЫЛЬ" НА ФОНЕ --- */
        .dust {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .dust span {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 6s ease-in-out infinite;
        }
        .dust span:nth-child(1)  { left: 8%;  top: 20%; animation-delay: 0s; }
        .dust span:nth-child(2)  { left: 25%; top: 70%; animation-delay: 1s; }
        .dust span:nth-child(3)  { left: 40%; top: 30%; animation-delay: 2s; }
        .dust span:nth-child(4)  { left: 60%; top: 80%; animation-delay: 3s; }
        .dust span:nth-child(5)  { left: 75%; top: 15%; animation-delay: 4s; }
        .dust span:nth-child(6)  { left: 90%; top: 55%; animation-delay: 5s; }
        .dust span:nth-child(7)  { left: 15%; top: 45%; animation-delay: 2.5s; }
        .dust span:nth-child(8)  { left: 55%; top: 10%; animation-delay: 1.5s; }
        .dust span:nth-child(9)  { left: 85%; top: 90%; animation-delay: 3.5s; }
        .dust span:nth-child(10) { left: 50%; top: 50%; animation-delay: 4.5s; }

        /* --- КОНТЕЙНЕР --- */
        .container {
            max-width: 450px;
            width: 100%;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
            position: relative;
            z-index: 10;
        }

        /* --- АВАТАРКА С АНИМИРОВАННЫМ КОЛЬЦОМ --- */
        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }
        .avatar-wrapper::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #9146FF, #00d4ff, #9146FF);
            animation: rotateRing 4s linear infinite;
            z-index: -1;
            filter: blur(3px);
            opacity: 0.9;
        }
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0f0c29;
            display: block;
            transition: transform 0.3s ease;
        }
        .avatar:hover { transform: scale(1.05); }

        /* --- ТЕКСТ --- */
        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 26px;
            font-weight: 800;
            margin: 5px 0 5px 0;
            letter-spacing: 0.5px;
			color: #ffffff;
			text-shadow: 0 0 20px rgba(183, 138, 255, 0.4);
        }
        p { font-size: 14px; color: #b0b0b0; margin-bottom: 30px; }

        /* --- ОСНОВНЫЕ КНОПКИ --- */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            margin-bottom: 14px;
            border-radius: 14px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.35);
        }
        .link-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.55);
            filter: brightness(1.1);
        }

        /* Градиентные цвета платформ */
        .twitch   { background: linear-gradient(135deg, #6d3bbf, #4a1f8f); }
        .youtube  { background: linear-gradient(135deg, #cc0000, #7a0000); }
        .telegram { background: linear-gradient(135deg, #1f8fc7, #0f5a80); }
        .discord  { background: linear-gradient(135deg, #4a5bd9, #2c3590); }
        .boosty   { background: linear-gradient(135deg, #ff7a1a, #cc4d00); }
        .wtv      { background: linear-gradient(135deg, #3a3a3a, #1a1a1a); }

        /* --- РАСКРЫВАЮЩИЕСЯ ГРУППЫ --- */
        .link-group { margin-bottom: 14px; position: relative; }
        .sub-links {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.5s ease;
            opacity: 0;
            margin-top: 4px;
        }
        .link-group:hover .sub-links { max-height: 400px; opacity: 1; }
        .sub-links .link-btn {
            margin-bottom: 8px;
            font-size: 13px;
            padding: 12px;
            filter: brightness(0.75);
            border-radius: 10px;
        }
        .sub-links .link-btn:hover { filter: brightness(1); }

        /* --- АНИМАЦИИ --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes rotateRing {
            to { transform: rotate(360deg); }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.6; transform: scale(1); }
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f0c29; }
        ::-webkit-scrollbar-thumb { background: #6b2fbf; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9146FF; }

        /* ============================================ */
        /* === МОБИЛЬНАЯ ВЕРСИЯ (для экранов < 600px) === */
        /* ============================================ */
        @media (max-width: 600px) {
            body {
                padding: 15px;
                justify-content: flex-start;
                padding-top: 40px;
                padding-bottom: 30px;
            }

            .avatar-wrapper { margin-bottom: 15px; }
            .avatar { width: 100px; height: 100px; border-width: 3px; }
            .avatar-wrapper::before { inset: -5px; }

            h1 { font-size: 20px; }
            p { font-size: 12px; margin-bottom: 22px; }

            .link-btn {
                padding: 17px 16px;
                font-size: 14px;
                margin-bottom: 11px;
                border-radius: 11px;
            }
            .link-btn:hover { transform: none; filter: brightness(1.08); }

            /* Принудительно раскрываем все подссылки */
            .sub-links {
                max-height: none !important;
                opacity: 1 !important;
                overflow: visible !important;
                margin-top: 0;
            }
            .sub-links .link-btn {
                margin-bottom: 11px;
                font-size: 14px;
                padding: 17px 16px;
                filter: none;
                border-radius: 11px;
            }
            .sub-links .link-btn:hover { transform: none; filter: brightness(1.08); }
        }

        @media (max-width: 360px) {
            .avatar { width: 85px; height: 85px; }
            h1 { font-size: 18px; }
            .link-btn { font-size: 13px; padding: 15px 12px; }
        }
    </style>
</head>
<body>

</html>
