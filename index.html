<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krabick - Ссылки</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- ОБЩИЕ НАСТРОЙКИ И АНИМИРОВАННЫЙ ФОН --- */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 450px;
            width: 100%;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
            position: relative;
            z-index: 10;
        }
        
        /* --- ЛЕТАЮЩИЕ ШЛЕМЫ (БЕЛЫЕ, МАЛЕНЬКИЕ) --- */
        .background-helmets {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .helmet {
            position: absolute;
            bottom: -120px;
            width: 40px; /* Уменьшили базовый размер */
            opacity: 0;
            animation: floatUp 25s linear infinite;
            filter: brightness(0) invert(1); /* Делает картинку полностью белой */
        }
        /* Уменьшенные размеры для каждого шлема */
        .helmet:nth-child(1) { left: 5%; animation-duration: 25s; animation-delay: 0s; width: 35px; }
        .helmet:nth-child(2) { left: 20%; animation-duration: 18s; animation-delay: 3s; width: 45px; }
        .helmet:nth-child(3) { left: 35%; animation-duration: 30s; animation-delay: 6s; width: 30px; }
        .helmet:nth-child(4) { left: 50%; animation-duration: 22s; animation-delay: 1s; width: 40px; }
        .helmet:nth-child(5) { left: 65%; animation-duration: 28s; animation-delay: 8s; width: 38px; }
        .helmet:nth-child(6) { left: 80%; animation-duration: 20s; animation-delay: 4s; width: 32px; }
        .helmet:nth-child(7) { left: 95%; animation-duration: 26s; animation-delay: 10s; width: 42px; }

        /* --- АВАТАРКА --- */
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #6b2fbf;
            box-shadow: 0 0 25px rgba(107, 47, 191, 0.6);
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }
        .avatar:hover { transform: scale(1.05); }

        /* --- ТЕКСТ --- */
        h1 { font-size: 28px; font-weight: 800; margin: 10px 0 5px 0; letter-spacing: 1px; }
        p { font-size: 15px; color: #b0b0b0; margin-bottom: 30px; }

        /* --- ОСНОВНЫЕ КНОПКИ --- */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 12px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
            z-index: 11;
        }
        .link-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            filter: brightness(1.15);
        }

        /* Тёмные цвета платформ */
        .twitch { background-color: #5c2e9e; }
        .youtube { background-color: #b30000; }
        .telegram { background-color: #1877a8; }
        .discord { background-color: #3f4bb5; }
        
        /* --- КНОПКА W.TV (Светлее, без рамки) --- */
        .wtv { 
            background-color: #555555;
            border: none;
        }
        .w-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            color: #000000;
            width: 20px;
            height: 20px;
            font-weight: 900;
            font-size: 14px;
            border-radius: 4px;
            font-family: Arial, sans-serif;
        }

        /* --- РАСКРЫВАЮЩИЕСЯ ГРУППЫ --- */
        .link-group { margin-bottom: 15px; position: relative; }
        .sub-links {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.5s ease;
            opacity: 0;
            margin-top: 5px;
        }
        .link-group:hover .sub-links { max-height: 300px; opacity: 1; }
        .sub-links .link-btn {
            margin-bottom: 8px;
            font-size: 14px;
            padding: 12px;
            filter: brightness(0.7);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .sub-links .link-btn:hover { filter: brightness(1); transform: translateY(-2px); }

        /* --- АНИМАЦИИ --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.2; } /* Сделал чуть прозрачнее, чтобы не отвлекали */
            90% { opacity: 0.2; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

        <img src="helmet.png" class="helmet" alt="">
        <img src="helmet.png" class="helmet" alt="">
        <img src="helmet.png" class="helmet" alt="">
        <img src="helmet.png" class="helmet" alt="">
        <img src="helmet.png" class="helmet" alt="">
        <img src="helmet.png" class="helmet" alt="">
    </div>

    <div class="container">

        <p>Стример и просто хороший человек</p>

        <a href="https://twitch.tv/krabick" class="link-btn twitch" target="_blank">
            <i class="fab fa-twitch"></i> Twitch
        </a>

        <div class="link-group">
            <a href="https://youtube.com/@krabickVODs" class="link-btn youtube" target="_blank">
                <i class="fab fa-youtube"></i> YouTube
            </a>
            <div class="sub-links">
                <a href="https://youtube.com/@krabick" class="link-btn youtube" target="_blank">
                    <i class="fab fa-youtube"></i> Основной канал
                </a>
                <a href="https://youtube.com/@krabickVODs" class="link-btn youtube" target="_blank">
                    <i class="fas fa-video"></i> Записи стримов
                </a>
                <a href="https://youtube.com/@krabickClips" class="link-btn youtube" target="_blank">
                    <i class="fas fa-film"></i> Клипы
                </a>

        </div>

        <div class="link-group">
            <a href="https://t.me/krabick" class="link-btn telegram" target="_blank">

            </a>
            <div class="sub-links">
                <a href="https://t.me/krabick" class="link-btn telegram" target="_blank">
                    <i class="fab fa-telegram"></i> Канал
                </a>
                <a href="https://t.me/krabick_chat" class="link-btn telegram" target="_blank">
                    <i class="fas fa-comments"></i> Чат
                </a>
            </div>
        </div>

        <a href="https://w.tv/krabick" class="link-btn wtv" target="_blank">
            <span class="w-icon">W</span> w.tv
        </a>

        <a href="https://discord.com/invite/4cCk3pj" class="link-btn discord" target="_blank">
            <i class="fab fa-discord"></i> Discord
        </a>
    </div>
</body>
</html>
