<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krabick - Ссылки</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- ОБЩИЕ НАСТРОЙКИ И АНИМИРОВАННЫЙ ФОН --- */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .container {
            max-width: 450px;
            width: 100%;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        /* --- АВАТАРКА --- */
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #6b2fbf;
            box-shadow: 0 0 25px rgba(107, 47, 191, 0.6);
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }
        .avatar:hover { transform: scale(1.05); }

        /* --- ТЕКСТ --- */
        h1 { font-size: 28px; font-weight: 800; margin: 10px 0 5px 0; letter-spacing: 1px; }
        p { font-size: 15px; color: #b0b0b0; margin-bottom: 30px; }

        /* --- ОСНОВНЫЕ КНОПКИ --- */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 12px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .link-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            filter: brightness(1.15);
        }

        /* Тёмные цвета платформ */
        .twitch { background-color: #5c2e9e; }
        .youtube { background-color: #b30000; }
        .telegram { background-color: #1877a8; }
        .discord { background-color: #3f4bb5; }
        
        /* --- КНОПКА W.TV (Темнее, без значка) --- */
        .wtv { 
            background-color: #2a2a2a; /* Тёмно-серый цвет */
        }

        /* --- РАСКРЫВАЮЩИЕСЯ ГРУППЫ --- */
        .link-group { margin-bottom: 15px; position: relative; }
        .sub-links {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.5s ease;
            opacity: 0;
            margin-top: 5px;
        }
        .link-group:hover .sub-links { max-height: 300px; opacity: 1; }
        .sub-links .link-btn {
            margin-bottom: 8px;
            font-size: 14px;
            padding: 12px;
            filter: brightness(0.7);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .sub-links .link-btn:hover { filter: brightness(1); transform: translateY(-2px); }

        /* --- АНИМАЦИИ --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://unavatar.io/twitch/krabick" alt="Аватар" class="avatar">
        
        <h1>Krabick</h1>
        <p>Стример и просто хороший человек</p>

        <a href="https://twitch.tv/krabick" class="link-btn twitch" target="_blank">
            <i class="fab fa-twitch"></i> Twitch
        </a>

        <div class="link-group">
            <a href="https://youtube.com/@krabickVODs" class="link-btn youtube" target="_blank">
                <i class="fab fa-youtube"></i> ЗАПИСЬ СТРИМОВ
            </a>
            <div class="sub-links">
                <a href="https://youtube.com/@krabickstream" class="link-btn youtube" target="_blank">
                    <i class="fab fa-youtube"></i> YouTube Канал с Хайлайтами
                </a>
                <a href="https://youtube.com/@НарезкиКраба" class="link-btn youtube" target="_blank">
                    <i class="fab fa-youtube"></i> Нарезки Краба
                </a>
            </div>
        </div>

        <div class="link-group">
            <a href="https://t.me/krabick" class="link-btn telegram" target="_blank">
                <i class="fab fa-telegram"></i> Telegram
            </a>
            <div class="sub-links">
                <a href="https://t.me/+DSt0P-oObZUwMjAy" class="link-btn telegram" target="_blank">
                    <i class="fab fa-telegram"></i> Канал с записями 
                </a>
            </div>
        </div>

        <div class="link-group">
                <a href="https://w.tv/krabick" class="link-btn wtv" target="_blank">
                    w.tv
                </a>
            <div class="sub-links">
                <a href="https://pastebin.com/iKdsmEGS" class="link-btn wtv" target="_blank">
                    ссылки на VODs
                </a>
            </div>
        </div>


        <a href="https://discord.com/invite/4cCk3pj" class="link-btn discord" target="_blank">
            <i class="fab fa-discord"></i> Discord
        </a>
    </div>
</body>
</html>
