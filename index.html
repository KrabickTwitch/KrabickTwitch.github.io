<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krabick - Ссылки</title>
    <!-- Подключаем красивый шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Подключаем иконки Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- ОБЩИЕ НАСТРОЙКИ И АНИМИРОВАННЫЙ ФОН --- */
        body {
            font-family: 'Inter', sans-serif;
            /* Тёмный градиент, который будет двигаться */
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite; /* Плавное переливание */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            position: relative; /* Чтобы шлемы позиционировались относительно body */
            overflow-x: hidden; /* Скрываем горизонтальную прокрутку от шлемов */
        }
        
        .container {
            max-width: 450px;
            width: 100%;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
            position: relative; /* Чтобы контент был поверх шлемов */
            z-index: 10;
        }
        
        /* --- ЛЕТАЮЩИЕ ШЛЕМЫ НА ФОНЕ (ВСТРОЕННЫЕ SVG) --- */
        .background-helmets {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Чтобы шлемы не мешали кликам по кнопкам */
            z-index: 1; /* Шлемы находятся за контентом */
            overflow: hidden;
        }
        .helmet {
            position: absolute;
            bottom: -120px; /* Начинаем за нижним краем экрана */
            width: 70px; /* Размер шлема */
            opacity: 0; /* Изначально невидимы */
            animation: floatUp 25s linear infinite; /* Анимация подъёма */
        }
        /* Разные размеры, скорости и задержки для каждого шлема, чтобы они не летели кучей */
        .helmet:nth-child(1) { left: 5%; animation-duration: 25s; animation-delay: 0s; width: 60px; }
        .helmet:nth-child(2) { left: 20%; animation-duration: 18s; animation-delay: 3s; width: 80px; }
        .helmet:nth-child(3) { left: 35%; animation-duration: 30s; animation-delay: 6s; width: 50px; }
        .helmet:nth-child(4) { left: 50%; animation-duration: 22s; animation-delay: 1s; width: 70px; }
        .helmet:nth-child(5) { left: 65%; animation-duration: 28s; animation-delay: 8s; width: 65px; }
        .helmet:nth-child(6) { left: 80%; animation-duration: 20s; animation-delay: 4s; width: 55px; }
        .helmet:nth-child(7) { left: 95%; animation-duration: 26s; animation-delay: 10s; width: 75px; }

        /* --- АВАТАРКА --- */
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #6b2fbf; /* Более тёмный фиолетовый */
            box-shadow: 0 0 25px rgba(107, 47, 191, 0.6);
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }
        .avatar:hover {
            transform: scale(1.05);
        }

        /* --- ТЕКСТ --- */
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 10px 0 5px 0;
            letter-spacing: 1px;
        }
        p {
            font-size: 15px;
            color: #b0b0b0;
            margin-bottom: 30px;
        }

        /* --- ОСНОВНЫЕ КНОПКИ (ТЁМНЫЕ ОТТЕНКИ) --- */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 12px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
            z-index: 11; /* Кнопки поверх шлемов */
        }
        .link-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            filter: brightness(1.15);
        }

        /* Тёмные цвета платформ */
        .twitch { background-color: #5c2e9e; }
        .youtube { background-color: #b30000; }
        .telegram { background-color: #1877a8; }
        .discord { background-color: #3f4bb5; }
        .donate { background-color: #cc4444; }
        
        /* --- КНОПКА W.TV (ЧЕРНЫЙ ФОН, БЕЛАЯ W) --- */
        .wtv { 
            background-color: #000000; 
            border: 1px solid #333; /* Легкая рамка, чтобы кнопка не сливалась с фоном */
        }
        .w-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            color: #000000;
            width: 20px;
            height: 20px;
            font-weight: 900;
            font-size: 14px;
            border-radius: 4px;
            font-family: Arial, sans-serif;
        }

        /* --- РАСКРЫВАЮЩИЕСЯ ГРУППЫ (YOUTUBE, TELEGRAM) --- */
        .link-group {
            margin-bottom: 15px;
            position: relative;
        }
        .sub-links {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.5s ease;
            opacity: 0;
            margin-top: 5px;
        }
        .link-group:hover .sub-links {
            max-height: 300px; /* Достаточно для нескольких ссылок */
            opacity: 1;
        }
        .sub-links .link-btn {
            margin-bottom: 8px;
            font-size: 14px;
            padding: 12px;
            filter: brightness(0.7); /* Затемнение подссылок */
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .sub-links .link-btn:hover {
            filter: brightness(1); /* Возвращаем яркость при наведении */
            transform: translateY(-2px);
        }

        /* --- АНИМАЦИИ --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3; /* Шлемы стали более заметными */
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-120vh) rotate(360deg); /* Улетаем вверх и немного вращаемся */
                opacity: 0;
            }
        }
    </style>
</head>
