<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои ссылки</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        /* Вот эти стили отвечают за круглую аватарку */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%; /* Делает круг */
            object-fit: cover;  /* Обрезает лишнее, не растягивая */
            border: 3px solid #9146FF;
            margin-bottom: 15px;
        }
        h1 { margin: 10px 0 5px 0; }
        p { color: #aaaaaa; margin-bottom: 30px; }
        .link-btn {
            display: block;
            background-color: #1f1f1f;
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 10px;
            font-weight: 600;
            border: 1px solid #333;
        }
        .link-btn:hover { background-color: #9146FF; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Убедитесь, что здесь есть class="avatar" -->
        <img src="https://unavatar.io/twitch/krabick" alt="Аватар" class="avatar">
        
        <h1>KrabickTwitch</h1>
        <p>Мои ссылки и соцсети</p>

        <a href="https://twitch.tv/ваш_канал" class="link-btn" target="_blank">Twitch</a>
        <a href="https://t.me/ваш_канал" class="link-btn" target="_blank">Telegram</a>
    </div>
</body>
</html>
